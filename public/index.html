<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The clonepage development environment is ready for building." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23182725%22/><path d=%22M10 11h12M10 16h8M10 21h10%22 stroke=%22%23f4b860%22 stroke-width=%222.5%22 stroke-linecap=%22round%22/></svg>" />
    <title>clonepage | Development environment</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #182725;
        background: #f4f0e8;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: #f4f0e8;
      }

      main {
        width: min(1120px, calc(100% - 40px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 32px 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 48px;
      }

      header, footer, .status, .meta {
        display: flex;
        align-items: center;
      }

      header, footer { justify-content: space-between; }

      .brand {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .status {
        gap: 8px;
        color: #38534f;
        font-size: 0.84rem;
        font-weight: 650;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #26866f;
        box-shadow: 0 0 0 4px #d6e7df;
      }

      .hero {
        align-self: center;
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr);
        gap: 64px;
        align-items: end;
        padding: 40px 0;
      }

      .eyebrow {
        margin: 0 0 20px;
        color: #9a552d;
        font-size: 0.76rem;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3.4rem, 8vw, 7.2rem);
        font-weight: 500;
        line-height: 0.9;
        letter-spacing: -0.065em;
      }

      h1 em { color: #9a552d; font-weight: inherit; }

      .panel {
        padding: 26px;
        border: 1px solid #c8c2b6;
        border-radius: 4px;
        background: #eee8dd;
      }

      .panel h2 {
        margin: 0 0 24px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.4rem;
      }

      .meta {
        justify-content: space-between;
        gap: 16px;
        padding: 13px 0;
        border-top: 1px solid #d2ccc0;
        font-size: 0.86rem;
      }

      .meta span:first-child { color: #6a706d; }
      .meta code { color: #182725; font-weight: 700; }

      footer {
        color: #5d6865;
        font-size: 0.8rem;
      }

      footer a { color: #38534f; }

      @media (max-width: 760px) {
        main { width: min(100% - 32px, 560px); gap: 24px; }
        .hero { grid-template-columns: 1fr; gap: 40px; padding: 24px 0; }
        h1 { font-size: clamp(3.2rem, 18vw, 5rem); }
        footer { align-items: flex-start; flex-direction: column; gap: 8px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="brand">clonepage</div>
        <div class="status" role="status">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-label">Checking service</span>
        </div>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Development workspace</p>
          <h1 id="page-title">Ready to build the <em>next page.</em></h1>
        </div>

        <aside class="panel" aria-label="Environment details">
          <h2>Environment online</h2>
          <div class="meta"><span>Runtime</span><code>Node 22</code></div>
          <div class="meta"><span>Container</span><code>Docker Compose</code></div>
          <div class="meta"><span>App port</span><code>3000</code></div>
        </aside>
      </section>

      <footer>
        <span>A clean starting point for implementation.</span>
        <a href="/api/health">View service health</a>
      </footer>
    </main>

    <script>
      fetch("/api/health")
        .then((response) => {
          if (!response.ok) throw new Error("Health check failed");
          document.querySelector("#status-label").textContent = "Service healthy";
        })
        .catch(() => {
          document.querySelector("#status-label").textContent = "Service unavailable";
        });
    </script>
  </body>
</html>
