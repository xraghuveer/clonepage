services:
  site:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      IS_ALLOY: ${IS_ALLOY:-false}
    volumes:
      - .:/workspace
    command: npm run dev
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
